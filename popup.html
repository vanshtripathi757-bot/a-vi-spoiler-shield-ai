<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GTA VI Spoiler Shield</title><link rel="stylesheet" href="popup.css"></head><body><main class="app">
<header><div class="mark">VI</div><div><h1>GTA VI SPOILER SHIELD</h1><p>Protection dashboard</p></div></header>
<section class="status"><span id="dot"></span><strong id="status">Protection enabled</strong><label class="switch"><input id="enabled" type="checkbox"><i></i></label></section>
<section class="stats"><div><b id="scanned">—</b><small>Scanned</small></div><div><b id="protected">—</b><small>Protected</small></div></section>
<label class="field">Sensitivity<select id="sensitivity"><option value="relaxed">Relaxed</option><option value="balanced">Balanced</option><option value="strict">Strict</option></select></label>
<section class="toggle"><div><b>AI classification</b><small>Mistral primary · Gemini backup</small></div><label class="switch"><input id="ai" type="checkbox"><i></i></label></section>
<label class="field">Vercel backend URL<input id="backend" type="url" placeholder="https://your-project.vercel.app"></label>
<button id="save">Save settings</button><p id="message"></p><footer>Provider API keys remain on the server.</footer>
</main><script src="popup.js"></script></body></html>
